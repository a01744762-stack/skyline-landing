<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skyline Rocketry — Wan Hu 67</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="stars-container">
        <div id="stars"></div>
        <div id="stars2"></div>
        <div id="stars3"></div>
    </div>

    <header class="navbar">
        <div class="logo-container">
            <img src="logo.png" alt="Skyline Logo" class="logo-img">
        </div>
        <div class="status-bar">
            <span class="status-indicator"><span class="pulse"></span> STATUS: NOMINAL</span>
            <span class="t-minus">T-MINUS 00:00:15</span>
        </div>
    </header>

    <main class="hero-section">
        <div class="hero-content">
            <h1 class="hero-title">ASCEND BEYOND</h1>
            <p class="hero-subtitle">Wan Hu 67 | Sinaloa - 2026</p>
            <p class="hero-tagline">Despegamos para hacer historia</p>

            <div class="specs-grid">
                <div class="spec-card">
                    <span class="spec-value">3,500 m</span>
                    <span class="spec-label">Apogeo Estimado</span>
                </div>
                <div class="spec-card">
                    <span class="spec-value">1.8 kN</span>
                    <span class="spec-label">Empuje Máximo</span>
                </div>
                <div class="spec-card">
                    <span class="spec-value">Mach 1.4</span>
                    <span class="spec-label">Velocidad Máx.</span>
                </div>
            </div>

            <div class="timeline-container">
                <h3 class="timeline-title">Secuencia de Misión</h3>
                <div class="timeline">
                    <div class="timeline-step active">
                        <div class="node"></div>
                        <span>Ignición</span>
                    </div>
                    <div class="timeline-step">
                        <div class="node"></div>
                        <span>Max Q</span>
                    </div>
                    <div class="timeline-step">
                        <div class="node"></div>
                        <span>Apogeo</span>
                    </div>
                    <div class="timeline-step">
                        <div class="node"></div>
                        <span>Recuperación</span>
                    </div>
                </div>
            </div>

            <a href="#specs" class="cta-button">VER ESPECIFICACIONES COMPLETAS</a>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
